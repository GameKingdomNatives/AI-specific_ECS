<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>深入战火 · 僚机战场</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      #stage { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; left: 16px; bottom: 14px; color: #d8d2c8; font: 13px/1.6 Consolas, monospace; }
      #ui { position: fixed; left: 16px; top: 14px; display: flex; gap: 8px; align-items: center; font: 13px/1.4 Consolas, monospace; }
      #ui button { background: #1c1a18; color: #e8e2d8; border: 1px solid #3a352f; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
      #ui button:hover { background: #2a2622; }
      #note { color: #b7a992; margin-left: 6px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui-root"></div>
    <div id="hud">tick 0 · entities 0</div>
    <script>
      // 启动期异常不能只躺在控制台：留在 window.__bootError，HUD/调试与自动化都能读到。
      addEventListener("error", (event) => { window.__bootError = String((event.error && event.error.stack) || event.message); var hud = document.getElementById("hud"); if (hud) hud.textContent = "启动失败：" + window.__bootError.split("\n")[0]; });
      addEventListener("unhandledrejection", (event) => { window.__bootError = String((event.reason && event.reason.stack) || event.reason); });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
